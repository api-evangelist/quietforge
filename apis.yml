apis:
- aid: quietforge:document-conversion-api
  name: Quietforge Document Conversion API
  description: >-
    Converts Word, Excel, PowerPoint and OpenDocument files with LibreOffice (PDF is an output format, not an input; files capped at 15 MB), extracts per-page text and metadata from digital PDFs (no OCR), and renders a URL or an HTML string to PNG, JPEG or PDF in headless Chromium. Paid per call in USDC on Base over x402; no signup or API key.
  humanURL: https://quietforge-studio.pages.dev/docs-api/
  baseURL: https://qf-api.quietforge-studio.workers.dev
  tags:
  - Documents
  - Conversion
  - PDF
  - Rendering
  - Screenshots
  properties:
  - type: OpenAPI
    url: openapi/quietforge-convert-api-openapi.yml
  - type: OpenAPI
    url: openapi/quietforge-pdf-api-openapi.yml
  - type: OpenAPI
    url: openapi/quietforge-render-api-openapi.yml
  - type: Documentation
    url: https://quietforge-studio.pages.dev/docs-api/
  - type: Pricing
    url: https://qf-api.quietforge-studio.workers.dev/.well-known/x402
    description: >-
      Pay per call in USDC on Base via x402. POST /v1/convert - $0.02 per call; POST /v1/pdf/text - $0.005 per call; POST /v1/render - $0.01 per call.
- aid: quietforge:x402-service-index-api
  name: Quietforge x402 Service Index API
  description: >-
    A searchable, health-probed index of live x402 pay-per-call endpoints re-crawled from the Coinbase CDP and PayAI bazaars, with per-endpoint probe history and settlement-verified demand read from USDC Transfer logs on Base. Quietforge operates the index and is listed in it under the same per-host cap as other operators.
  humanURL: https://quietforge-studio.pages.dev/x402-index/
  baseURL: https://qf-api.quietforge-studio.workers.dev
  tags:
  - x402
  - Agents
  - Discovery
  - Payments
  - Directory
  properties:
  - type: OpenAPI
    url: openapi/quietforge-x402-index-api-openapi.yml
  - type: Documentation
    url: https://quietforge-studio.pages.dev/x402-index/
  - type: Pricing
    url: https://qf-api.quietforge-studio.workers.dev/.well-known/x402
    description: >-
      Pay per call in USDC on Base via x402. GET /v1/x402/services - $0.005 per call; GET /v1/x402/services/{id} - $0.002 per call; GET /v1/x402/demand - $0.02 per call.
- aid: quietforge:puzzle-generation-api
  name: Quietforge Puzzle Generation API
  description: >-
    Generates sudoku puzzles with a proven-unique solution and a technique grade, and connected freeform crosswords from 8-30 caller-supplied clue/answer pairs with a verifier. Deterministic per seed; returns JSON or print-ready PDFs (a 30-60 puzzle sudoku book, or a crossword page with answer key).
  humanURL: https://quietforge-studio.pages.dev/docs-api/#sudoku
  baseURL: https://qf-api.quietforge-studio.workers.dev
  tags:
  - Puzzles
  - Sudoku
  - Crossword
  - PDF
  - Print
  properties:
  - type: OpenAPI
    url: openapi/quietforge-sudoku-api-openapi.yml
  - type: OpenAPI
    url: openapi/quietforge-crossword-api-openapi.yml
  - type: Documentation
    url: https://quietforge-studio.pages.dev/docs-api/#sudoku
  - type: Pricing
    url: https://qf-api.quietforge-studio.workers.dev/.well-known/x402
    description: >-
      Pay per call in USDC on Base via x402. POST /v1/sudoku - $0.01 per call; POST /v1/sudoku/book - $3.99 per call; POST /v1/crossword - $0.02 per call; POST /v1/crossword/pdf - $3.99 per call.
- aid: quietforge:book-typesetting-api
  name: Quietforge Book Typesetting API
  description: >-
    Typesets a prose manuscript into a print-ready book interior (chapter detection, mirrored margins, running heads, front matter and contents at 5x8, 5.25x8, 5.5x8.5, 6x9 or A5) delivered as a PDF, an editable .docx and a layout report, with a cheaper outline route that reports the chapter split first. Prose only; text is not rewritten.
  humanURL: https://quietforge-studio.pages.dev/docs-api/#typeset
  baseURL: https://qf-api.quietforge-studio.workers.dev
  tags:
  - Typesetting
  - Publishing
  - Books
  - PDF
  - DOCX
  properties:
  - type: OpenAPI
    url: openapi/quietforge-typeset-api-openapi.yml
  - type: Documentation
    url: https://quietforge-studio.pages.dev/docs-api/#typeset
  - type: Pricing
    url: https://qf-api.quietforge-studio.workers.dev/.well-known/x402
    description: >-
      Pay per call in USDC on Base via x402. POST /v1/typeset/outline - $0.01 per call; POST /v1/typeset - $7.99 per call.
- aid: quietforge:family-chart-api
  name: Quietforge Family Tree Chart API
  description: >-
    Lays out a descendant, ancestor or hourglass family tree chart from people+families JSON or a GEDCOM file (up to 400 people, 10 generations), returned as verified layout JSON or as print-ready poster and tiled PDFs, with living people privatised by default.
  humanURL: https://quietforge-studio.pages.dev/docs-api/
  baseURL: https://qf-api.quietforge-studio.workers.dev
  tags:
  - Genealogy
  - Family Tree
  - Charts
  - PDF
  - Print
  properties:
  - type: OpenAPI
    url: openapi/quietforge-familytree-api-openapi.yml
  - type: Documentation
    url: https://quietforge-studio.pages.dev/docs-api/
  - type: Pricing
    url: https://qf-api.quietforge-studio.workers.dev/.well-known/x402
    description: >-
      Pay per call in USDC on Base via x402. POST /v1/familytree - $0.02 per call; POST /v1/familytree/pdf - $4.99 per call.
- aid: quietforge:dataset-audit-api
  name: Quietforge Dataset Audit API
  description: >-
    Audits a CSV or JSON-array dataset (up to 5 MB, 50,000 rows, 200 columns) for duplicate rows, missing values, inferred types, class imbalance, IQR outliers and PII-pattern counts, combined into a heuristic 0-100 quality score, as JSON or a PDF summary. A free preview route scores a small sample without payment.
  humanURL: https://quietforge-studio.pages.dev/docs-api/#dataset-audit
  baseURL: https://qf-api.quietforge-studio.workers.dev
  tags:
  - Data Quality
  - Datasets
  - Validation
  - Profiling
  properties:
  - type: OpenAPI
    url: openapi/quietforge-dataset-audit-api-openapi.yml
  - type: Documentation
    url: https://quietforge-studio.pages.dev/docs-api/#dataset-audit
  - type: Pricing
    url: https://qf-api.quietforge-studio.workers.dev/.well-known/x402
    description: >-
      Pay per call in USDC on Base via x402. POST /v1/dataset-audit - $0.03 per call; POST /v1/dataset-audit/pdf - $1.99 per call; POST /v1/dataset-audit/preview - free.

