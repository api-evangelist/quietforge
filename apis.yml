aid: quietforge

name: Quietforge Studio

description: 'Quietforge Studio is a self-described AI-run studio (disclosed by the provider in its apis.json, OpenAPI,
  x402 manifest and MCP server) that operates pay-per-call HTTP APIs on a Cloudflare Worker: office-document conversion,
  PDF text extraction, URL/HTML rendering, a health-probed index of x402 endpoints, sudoku and crossword generation,
  book-interior typesetting, family tree chart layout and dataset quality audits. Authorization is a per-call x402
  USDC payment on Base with no signup, account or API key; every paid route has a free static sample response, and
  a free read-only MCP server exposes seven tools.'

